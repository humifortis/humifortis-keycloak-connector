name: Build and Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and run tests
        run: mvn clean verify
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: humifortis-keycloak-connector
          path: target/humifortis-keycloak-connector.jar
