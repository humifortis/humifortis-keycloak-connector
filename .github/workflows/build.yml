name: Build, Test and Release

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and run tests
        run: mvn -B clean verify
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: humifortis-keycloak-connector
          path: target/humifortis-keycloak-connector.jar

  release:
    # Publishes the jar built above as a GitHub release when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: humifortis-keycloak-connector
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: humifortis-keycloak-connector.jar
          generate_release_notes: true
